name: Publish Maven Central

on:
  workflow_call:
    inputs:
      version:
        description: Bare SemVer version to publish
        required: true
        type: string
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: publish-maven-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Validate bare SemVer tag
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be bare SemVer, for example 2.0.0"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.version || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # 5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # 6.3.0
        with:
          gradle-version: "9.6.1"
          cache-read-only: true

      - name: Test and publish
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ inputs.version || github.ref_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralPublishing: "true"
          ORG_GRADLE_PROJECT_mavenCentralAutomaticPublishing: "true"
          ORG_GRADLE_PROJECT_signAllPublications: "true"
        run: >-
          gradle
          :api-trace-core:test
          :api-trace-debug:test
          :api-trace-core:assemble
          :api-trace-debug:assemble
          :api-trace-noop:assemble
          publishToMavenCentral
